<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Department Management System (DMS) Framework</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#102a43',
                            800: '#0b1b2b',
                            900: '#061325',
                        },
                        finance: {
                            green: '#10b981',
                            red: '#ef4444',
                            amber: '#f59e0b',
                            blue: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel JS -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Mock Initial Data
        const INITIAL_TRANSACTIONS = [
            { id: 'TXN-9081', date: '2026-10-28', category: 'Operational', desc: 'Sewa Cloud Infrastructure Q4', amount: -45000000, status: 'Completed', type: 'Expense', dept: 'IT & Infrastructure' },
            { id: 'TXN-9082', date: '2026-10-29', category: 'Revenue', desc: 'Pembayaran Termin 2 PT Enterprise Tech', amount: 350000000, status: 'Completed', type: 'Income', dept: 'Sales & BD' },
            { id: 'TXN-9083', date: '2026-10-29', category: 'Payroll', desc: 'Gaji & Tunjangan Karyawan Oktober', amount: -180000000, status: 'Completed', type: 'Expense', dept: 'HR & Finance' },
            { id: 'TXN-9084', date: '2026-10-30', category: 'Accounts Payable', desc: 'Pembelian Material Vendor Utama', amount: -65000000, status: 'Pending', type: 'Expense', dept: 'Supply Chain' },
            { id: 'TXN-9085', date: '2026-10-30', category: 'Accounts Receivable', desc: 'Invoice #INV-2026-88 Client Advisory', amount: 125000000, status: 'Pending', type: 'Income', dept: 'Consulting' },
            { id: 'TXN-9086', date: '2026-10-31', category: 'Marketing', desc: 'Kampanye Q4 Digital Ads', amount: -25000000, status: 'Completed', type: 'Expense', dept: 'Marketing' },
        ];

        const INITIAL_BUDGETS = [
            { id: 1, dept: 'Teknologi & Informasi', allocated: 450000000, spent: 380000000, status: 'On Track' },
            { id: 2, dept: 'Pemasaran & Sales', allocated: 300000000, spent: 285000000, status: 'Warning' },
            { id: 3, dept: 'Operasional & Logistik', allocated: 600000000, spent: 510000000, status: 'On Track' },
            { id: 4, dept: 'Sumber Daya Manusia', allocated: 250000000, spent: 245000000, status: 'Critical' },
            { id: 5, dept: 'R&D dan Inovasi', allocated: 200000000, spent: 120000000, status: 'Under Budget' }
        ];

        const INITIAL_RISKS = [
            { id: 'AUD-01', title: 'Audit Kepatuhan Pajak Badan Q3', category: 'Tax Compliance', riskLevel: 'Medium', status: 'In Review', dueDate: '2026-11-15' },
            { id: 'AUD-02', title: 'Pembaruan SOP Otorisasi Pengeluaran Kas', category: 'Internal Control', riskLevel: 'Low', status: 'Approved', dueDate: '2026-10-20' },
            { id: 'AUD-03', title: 'Review Piutang Tertunggak > 90 Hari', category: 'Financial Risk', riskLevel: 'High', status: 'Action Needed', dueDate: '2026-11-05' },
            { id: 'AUD-04', title: 'Evaluasi Risiko Kurs Mata Uang Asing', category: 'Treasury Risk', riskLevel: 'Medium', status: 'In Review', dueDate: '2026-11-30' }
        ];

        const USERS_LIST = [
            { id: 1, name: 'Budi Santoso', email: 'budi.santoso@corporate.com', role: 'CFO', status: 'Active', lastLogin: 'Hari ini, 14:15' },
            { id: 2, name: 'Siti Rahmawati', email: 'siti.r@corporate.com', role: 'Finance Manager', status: 'Active', lastLogin: 'Hari ini, 13:40' },
            { id: 3, name: 'Dedi Kurniawan', email: 'dedi.k@corporate.com', role: 'Finance Staff', status: 'Active', lastLogin: 'Kemarin, 16:30' },
            { id: 4, name: 'Anita Wijaya', email: 'anita.auditor@external.com', role: 'Auditor', status: 'Active', lastLogin: '29 Okt 2026' }
        ];

        // Format Currency Helper
        const formatIDR = (val) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        };

        // Component App Utama
        function App() {
            const [currentTab, setCurrentTab] = useState('overview');
            const [darkMode, setDarkMode] = useState(false);
            const [userRole, setUserRole] = useState('CFO');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            // State Interaktif Data
            const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
            const [budgets, setBudgets] = useState(INITIAL_BUDGETS);
            const [risks, setRisks] = useState(INITIAL_RISKS);
            
            // Search & Filter
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('All');
            const [filterPeriod, setFilterPeriod] = useState('YTD');

            // Modals & Notifications
            const [showTxModal, setShowTxModal] = useState(false);
            const [showBudgetModal, setShowBudgetModal] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            // Notification Trigger
            const triggerToast = (msg, type = 'success') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Toggle Dark Mode
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Re-render Lucide Icons on view switch
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [currentTab, darkMode, isSidebarOpen, showTxModal, showBudgetModal]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans">
                    
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all transform animate-bounce ${
                            toastMessage.type === 'success' 
                                ? 'bg-emerald-50 text-emerald-800 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-200 dark:border-emerald-800' 
                                : 'bg-rose-50 text-rose-800 border-rose-300 dark:bg-rose-950 dark:text-rose-200 dark:border-rose-800'
                        }`}>
                            <i data-lucide={toastMessage.type === 'success' ? 'check-circle' : 'alert-circle'} className="w-5 h-5"></i>
                            <span>{toastMessage.msg}</span>
                        </div>
                    )}

                    {/* Sidebar Navigasi */}
                    <aside className={`${isSidebarOpen ? 'w-full md:w-64' : 'w-full md:w-20'} bg-slate-900 text-white flex-shrink-0 transition-all duration-300 z-30 border-r border-slate-800 flex flex-col justify-between`}>
                        <div>
                            {/* Header Sidebar */}
                            <div className="p-4 flex items-center justify-between border-b border-slate-800">
                                <div className="flex items-center gap-3 overflow-hidden">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center font-bold text-white text-lg flex-shrink-0 shadow-md">
                                        F
                                    </div>
                                    {isSidebarOpen && (
                                        <div className="flex flex-col">
                                            <span className="font-bold text-base tracking-wide leading-tight">FINANCE DMS</span>
                                            <span className="text-[10px] text-slate-400 uppercase tracking-widest">Enterprise System</span>
                                        </div>
                                    )}
                                </div>
                                <button 
                                    onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                    className="hidden md:flex p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors"
                                >
                                    <i data-lucide={isSidebarOpen ? "chevron-left" : "chevron-right"} className="w-5 h-5"></i>
                                </button>
                            </div>

                            {/* Menu Navigasi */}
                            <nav className="p-3 space-y-1">
                                {[
                                    { id: 'overview', label: 'Ringkasan Eksekutif', icon: 'layout-dashboard' },
                                    { id: 'budgeting', label: 'Anggaran & Perencanaan', icon: 'pie-chart' },
                                    { id: 'operations', label: 'Operasional & Transaksi', icon: 'arrow-left-right' },
                                    { id: 'compliance', label: 'Kepatuhan & Risiko', icon: 'shield-check' },
                                    { id: 'reporting', label: 'Pelaporan Keuangan', icon: 'file-text' },
                                    { id: 'settings', label: 'Pengaturan & Akses', icon: 'sliders' }
                                ].map((menu) => {
                                    const active = currentTab === menu.id;
                                    return (
                                        <button
                                            key={menu.id}
                                            onClick={() => setCurrentTab(menu.id)}
                                            className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition-all ${
                                                active 
                                                    ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' 
                                                    : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                                            }`}
                                        >
                                            <i data-lucide={menu.icon} className="w-5 h-5 flex-shrink-0"></i>
                                            {isSidebarOpen && <span className="truncate">{menu.label}</span>}
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>

                        {/* Profile & Role Info (Bottom Sidebar) */}
                        <div className="p-3 border-t border-slate-800 bg-slate-900/50">
                            {isSidebarOpen ? (
                                <div className="flex items-center justify-between p-2 rounded-xl bg-slate-800/60 border border-slate-700/50">
                                    <div className="flex items-center gap-2 overflow-hidden">
                                        <div className="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-xs">
                                            {userRole.substring(0, 2)}
                                        </div>
                                        <div className="truncate">
                                            <p className="text-xs font-semibold text-white truncate">Aktif: {userRole}</p>
                                            <p className="text-[10px] text-slate-400 truncate">Governance Active</p>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex justify-center py-2">
                                    <div className="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-xs">
                                        {userRole.substring(0, 2)}
                                    </div>
                                </div>
                            )}
                        </div>
                    </aside>

                    {/* Main Area Content */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar">
                        
                        {/* Top Header Navbar */}
                        <header className="sticky top-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 md:px-8 py-3.5 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                                    className="md:hidden p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                                >
                                    <i data-lucide="menu" className="w-5 h-5"></i>
                                </button>
                                <div>
                                    <h1 className="text-lg md:text-xl font-bold text-slate-900 dark:text-white capitalize">
                                        {currentTab === 'overview' && 'Ringkasan Eksekutif Keuangan'}
                                        {currentTab === 'budgeting' && 'Modul Anggaran & Perencanaan (FP&A)'}
                                        {currentTab === 'operations' && 'Manajemen Transaksi & Arus Kas'}
                                        {currentTab === 'compliance' && 'Kepatuhan Reguler & Tata Kelola Risiko'}
                                        {currentTab === 'reporting' && 'Pusat Pelaporan Finansial'}
                                        {currentTab === 'settings' && 'Pengaturan Akses & Otorisasi Peran'}
                                    </h1>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">
                                        Sistem Pengendalian Internal & Tata Kelola Keuangan Terpusat
                                    </p>
                                </div>
                            </div>

                            {/* Header Actions */}
                            <div className="flex items-center gap-2.5">
                                {/* Role Switcher Dropdown */}
                                <div className="hidden sm:flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                                    <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">Peran:</span>
                                    <select 
                                        value={userRole} 
                                        onChange={(e) => {
                                            setUserRole(e.target.value);
                                            triggerToast(`Peran pengguna diganti menjadi: ${e.target.value}`);
                                        }}
                                        className="bg-transparent text-xs font-semibold text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer"
                                    >
                                        <option value="CFO" className="dark:bg-slate-800">CFO (Executive)</option>
                                        <option value="Finance Manager" className="dark:bg-slate-800">Finance Manager</option>
                                        <option value="Staff" className="dark:bg-slate-800">Finance Staff</option>
                                        <option value="Auditor" className="dark:bg-slate-800">Internal Auditor</option>
                                    </select>
                                </div>

                                {/* Toggle Dark / Light Theme */}
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                                    title="Ganti Tema"
                                >
                                    <i data-lucide={darkMode ? "sun" : "moon"} className="w-4 h-4"></i>
                                </button>

                                {/* Quick Action Button */}
                                <button 
                                    onClick={() => setShowTxModal(true)}
                                    className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-md shadow-emerald-600/20 transition-all"
                                >
                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                    <span className="hidden sm:inline">Tambah Transaksi</span>
                                </button>
                            </div>
                        </header>

                        {/* Dynamic Body Content per Tab */}
                        <main className="p-4 md:p-8 space-y-6">

                            {/* TAB 1: OVERVIEW */}
                            {currentTab === 'overview' && (
                                <OverviewTab 
                                    transactions={transactions}
                                    budgets={budgets}
                                    risks={risks}
                                    setCurrentTab={setCurrentTab}
                                    setShowBudgetModal={setShowBudgetModal}
                                    formatIDR={formatIDR}
                                />
                            )}

                            {/* TAB 2: BUDGETING & PLANNING */}
                            {currentTab === 'budgeting' && (
                                <BudgetingTab 
                                    budgets={budgets}
                                    setShowBudgetModal={setShowBudgetModal}
                                    formatIDR={formatIDR}
                                />
                            )}

                            {/* TAB 3: OPERATIONS & TRANSACTIONS */}
                            {currentTab === 'operations' && (
                                <OperationsTab 
                                    transactions={transactions}
                                    setTransactions={setTransactions}
                                    searchQuery={searchQuery}
                                    setSearchQuery={setSearchQuery}
                                    filterCategory={filterCategory}
                                    setFilterCategory={setFilterCategory}
                                    setShowTxModal={setShowTxModal}
                                    formatIDR={formatIDR}
                                />
                            )}

                            {/* TAB 4: COMPLIANCE & RISK MANAGEMENT */}
                            {currentTab === 'compliance' && (
                                <ComplianceTab 
                                    risks={risks}
                                    setRisks={setRisks}
                                    triggerToast={triggerToast}
                                />
                            )}

                            {/* TAB 5: FINANCIAL REPORTING */}
                            {currentTab === 'reporting' && (
                                <ReportingTab 
                                    transactions={transactions}
                                    filterPeriod={filterPeriod}
                                    setFilterPeriod={setFilterPeriod}
                                    triggerToast={triggerToast}
                                    formatIDR={formatIDR}
                                />
                            )}

                            {/* TAB 6: SETTINGS & ACCESS CONTROL */}
                            {currentTab === 'settings' && (
                                <SettingsTab 
                                    userRole={userRole}
                                    setUserRole={setUserRole}
                                    users={USERS_LIST}
                                    triggerToast={triggerToast}
                                />
                            )}

                        </main>
                    </div>

                    {/* MODAL: Tambah Transaksi Baru */}
                    {showTxModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                                    <h3 className="font-bold text-lg text-slate-900 dark:text-white">Pencatatan Transaksi Baru</h3>
                                    <button onClick={() => setShowTxModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    const amountVal = parseFloat(formData.get('amount'));
                                    const typeVal = formData.get('type');
                                    
                                    const newTx = {
                                        id: `TXN-${Math.floor(1000 + Math.random() * 9000)}`,
                                        date: formData.get('date'),
                                        category: formData.get('category'),
                                        desc: formData.get('desc'),
                                        amount: typeVal === 'Expense' ? -Math.abs(amountVal) : Math.abs(amountVal),
                                        status: formData.get('status'),
                                        type: typeVal,
                                        dept: formData.get('dept')
                                    };
                                    setTransactions([newTx, ...transactions]);
                                    setShowTxModal(false);
                                    triggerToast('Transaksi baru berhasil ditambahkan ke ledger!');
                                }} className="space-y-3.5 text-xs">
                                    <div>
                                        <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Deskripsi Transaksi</label>
                                        <input required name="desc" type="text" placeholder="misal: Pembayaran Lisensi ERP" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Tipe Transaksi</label>
                                            <select name="type" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none">
                                                <option value="Expense">Pengeluaran (Expense)</option>
                                                <option value="Income">Pemasukan (Income)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Nominal (IDR)</label>
                                            <input required name="amount" type="number" placeholder="5000000" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Kategori</label>
                                            <select name="category" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none">
                                                <option value="Operational">Operational</option>
                                                <option value="Revenue">Revenue</option>
                                                <option value="Payroll">Payroll</option>
                                                <option value="Accounts Payable">Accounts Payable</option>
                                                <option value="Accounts Receivable">Accounts Receivable</option>
                                                <option value="Marketing">Marketing</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Departemen</label>
                                            <input required name="dept" type="text" placeholder="IT / Finance / Marketing" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Tanggal</label>
                                            <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Status</label>
                                            <select name="status" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none">
                                                <option value="Completed">Completed</option>
                                                <option value="Pending">Pending</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-3 flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowTxModal(false)} className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-100 dark:hover:bg-slate-700">Batal</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow-md shadow-blue-600/20">Simpan Transaksi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Pengajuan Revisi Anggaran */}
                    {showBudgetModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
                                    <h3 className="font-bold text-lg text-slate-900 dark:text-white">Formulir Pengajuan Revisi Anggaran</h3>
                                    <button onClick={() => setShowBudgetModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    setShowBudgetModal(false);
                                    triggerToast('Permohonan revisi anggaran telah dikirim ke CFO untuk otorisasi.');
                                }} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Departemen Pemohon</label>
                                        <select className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none">
                                            {budgets.map(b => <option key={b.id} value={b.dept}>{b.dept}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Tambahan Alokasi Anggaran (IDR)</label>
                                        <input required type="number" placeholder="50000000" className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-semibold text-slate-700 dark:text-slate-300">Justifikasi Kebutuhan Finansial</label>
                                        <textarea required rows="3" placeholder="Jelaskan kebutuhan pengeluaran ekstra..." className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none"></textarea>
                                    </div>
                                    <div className="pt-3 flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowBudgetModal(false)} className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-semibold">Batal</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">Kirim Permohonan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // ==========================================
        // COMPONENT SUB-TABS
        // ==========================================

        // 1. Overview Tab Component
        function OverviewTab({ transactions, budgets, risks, setCurrentTab, setShowBudgetModal, formatIDR }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Compute Metrics Dynamic
            const totalBudget = useMemo(() => budgets.reduce((acc, curr) => acc + curr.allocated, 0), [budgets]);
            const totalSpent = useMemo(() => budgets.reduce((acc, curr) => acc + curr.spent, 0), [budgets]);
            const netCashFlow = useMemo(() => transactions.reduce((acc, curr) => acc + curr.amount, 0), [transactions]);
            const openRisksCount = useMemo(() => risks.filter(r => r.status !== 'Approved').length, [risks]);

            useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt'],
                            datasets: [
                                {
                                    label: 'Pendapatan (Inflow)',
                                    data: [420, 480, 510, 560, 530, 610],
                                    borderColor: '#10b981',
                                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                    fill: true,
                                    tension: 0.3
                                },
                                {
                                    label: 'Pengeluaran (Outflow)',
                                    data: [310, 340, 390, 410, 380, 435],
                                    borderColor: '#ef4444',
                                    backgroundColor: 'rgba(239, 68, 68, 0.05)',
                                    fill: true,
                                    tension: 0.3
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: {
                                y: {
                                    ticks: { callback: (v) => 'Rp ' + v + 'M' },
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' }
                                },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            }, []);

            return (
                <div className="space-y-6">
                    {/* Key KPI Metrics Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <KpiCard 
                            title="Total Anggaran Perusahaan"
                            value={formatIDR(totalBudget)}
                            subText="Alokasi RKAT Tahun 2026"
                            icon="wallet"
                            trend="+4.2% vs 2025"
                            trendType="up"
                        />
                        <KpiCard 
                            title="Pengeluaran YTD"
                            value={formatIDR(totalSpent)}
                            subText={`${((totalSpent/totalBudget)*100).toFixed(1)}% dari Total Anggaran`}
                            icon="trending-down"
                            trend="Di bawah ambang batas"
                            trendType="up"
                        />
                        <KpiCard 
                            title="Arus Kas Bersih (Net Cash)"
                            value={formatIDR(netCashFlow)}
                            subText="Performa Kas Bulan Ini"
                            icon="activity"
                            trend="Surplus Positif"
                            trendType="up"
                        />
                        <KpiCard 
                            title="Status Kepatuhan & Audit"
                            value={`${100 - (openRisksCount * 5)}% Compliant`}
                            subText={`${openRisksCount} Audit Pending`}
                            icon="shield-alert"
                            trend="Kategori Sehat"
                            trendType="up"
                        />
                    </div>

                    {/* Middle Section: Interactive Charts & Variance Overview */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Interactive Main Chart */}
                        <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h3 className="font-bold text-base text-slate-900 dark:text-white">Tren Arus Kas & Finansial</h3>
                                    <p className="text-xs text-slate-500">Perbandingan Pemasukan vs Pengeluaran 6 Bulan Terakhir (dalam Miliar IDR)</p>
                                </div>
                                <span className="px-2.5 py-1 text-[11px] font-semibold bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 rounded-lg">Real-Time Data</span>
                            </div>
                            <div className="h-64 w-full">
                                <canvas ref={chartRef}></canvas>
                            </div>
                        </div>

                        {/* Top Department Budget Variance Widget */}
                        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-bold text-base text-slate-900 dark:text-white">Penyerapan Anggaran</h3>
                                <button onClick={() => setCurrentTab('budgeting')} className="text-xs text-blue-600 dark:text-blue-400 font-semibold hover:underline">Lihat Semua</button>
                            </div>
                            <div className="space-y-4">
                                {budgets.slice(0, 4).map((b) => {
                                    const percent = Math.round((b.spent / b.allocated) * 100);
                                    let barColor = 'bg-emerald-500';
                                    if (percent > 90) barColor = 'bg-amber-500';
                                    if (percent >= 100) barColor = 'bg-rose-500';

                                    return (
                                        <div key={b.id} className="space-y-1.5">
                                            <div className="flex justify-between text-xs font-medium">
                                                <span className="text-slate-700 dark:text-slate-300">{b.dept}</span>
                                                <span className="font-semibold text-slate-900 dark:text-white">{percent}%</span>
                                            </div>
                                            <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                                <div className={`h-full ${barColor} transition-all duration-500`} style={{ width: `${percent}%` }}></div>
                                            </div>
                                            <div className="flex justify-between text-[10px] text-slate-400">
                                                <span>Terpakai: {formatIDR(b.spent)}</span>
                                                <span>Total: {formatIDR(b.allocated)}</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Recent Transactions & Quick Actions */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Table Mini Transaksi Terakhir */}
                        <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-bold text-base text-slate-900 dark:text-white">Transaksi Terbaru</h3>
                                <button onClick={() => setCurrentTab('operations')} className="text-xs text-blue-600 dark:text-blue-400 font-semibold hover:underline">Ke Log Transaksi</button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-50 dark:bg-slate-700/50 text-slate-500 uppercase text-[10px]">
                                        <tr>
                                            <th className="p-2.5">ID Transaksi</th>
                                            <th className="p-2.5">Deskripsi</th>
                                            <th className="p-2.5">Kategori</th>
                                            <th className="p-2.5 text-right">Nominal</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                        {transactions.slice(0, 4).map(tx => (
                                            <tr key={tx.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-700/30">
                                                <td className="p-2.5 font-mono text-slate-500">{tx.id}</td>
                                                <td className="p-2.5 font-semibold text-slate-800 dark:text-slate-200">{tx.desc}</td>
                                                <td className="p-2.5">
                                                    <span className="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px]">
                                                        {tx.category}
                                                    </span>
                                                </td>
                                                <td className={`p-2.5 text-right font-bold ${tx.amount > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-200'}`}>
                                                    {tx.amount > 0 ? `+${formatIDR(tx.amount)}` : formatIDR(tx.amount)}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Quick Governance Actions Widget */}
                        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
                            <h3 className="font-bold text-base text-slate-900 dark:text-white">Aksi Cepat Governance</h3>
                            <p className="text-xs text-slate-500">Akses cepat ke alur kerja manajemen keuangan terotorisasi.</p>
                            <div className="space-y-2 pt-1">
                                <button onClick={() => setShowBudgetModal(true)} className="w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-xs font-semibold text-slate-700 dark:text-slate-200">
                                    <span className="flex items-center gap-2.5"><i data-lucide="file-plus" className="w-4 h-4 text-blue-500"></i> Ajukan Revisi Anggaran</span>
                                    <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                                </button>
                                <button onClick={() => setCurrentTab('compliance')} className="w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-xs font-semibold text-slate-700 dark:text-slate-200">
                                    <span className="flex items-center gap-2.5"><i data-lucide="shield-check" className="w-4 h-4 text-emerald-500"></i> Audit Kepatuhan Risiko</span>
                                    <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                                </button>
                                <button onClick={() => setCurrentTab('reporting')} className="w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-xs font-semibold text-slate-700 dark:text-slate-200">
                                    <span className="flex items-center gap-2.5"><i data-lucide="download" className="w-4 h-4 text-purple-500"></i> Unduh Laporan Keuangan</span>
                                    <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Card Template KPI
        function KpiCard({ title, value, subText, icon, trend, trendType }) {
            return (
                <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between space-y-2">
                    <div className="flex items-center justify-between">
                        <span className="text-xs font-medium text-slate-500 dark:text-slate-400">{title}</span>
                        <div className="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-700 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                            <i data-lucide={icon} className="w-5 h-5"></i>
                        </div>
                    </div>
                    <div>
                        <div className="text-xl font-bold text-slate-900 dark:text-white tracking-tight">{value}</div>
                        <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1">{subText}</p>
                    </div>
                    <div className="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">
                        <i data-lucide="trending-up" className="w-3.5 h-3.5 mr-1"></i>
                        <span>{trend}</span>
                    </div>
                </div>
            );
        }

        // 2. Budgeting & Planning Tab Component
        function BudgetingTab({ budgets, setShowBudgetModal, formatIDR }) {
            return (
                <div className="space-y-6">
                    {/* Header Action Banner */}
                    <div className="bg-gradient-to-r from-slate-900 to-blue-900 text-white rounded-2xl p-6 shadow-md flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-lg font-bold">Modul Perencanaan & Analisis Anggaran (FP&A)</h2>
                            <p className="text-xs text-slate-300 mt-1 max-w-2xl">
                                Pantau batas pengeluaran operasional per departemen, lakukan *variance analysis*, dan ajukan perubahan plafon anggaran sesuai standar akuntabilitas korporat.
                            </p>
                        </div>
                        <button onClick={() => setShowBudgetModal(true)} className="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-md transition-all flex items-center gap-2">
                            <i data-lucide="plus-circle" className="w-4 h-4"></i>
                            Ajukan Revisi Anggaran
                        </button>
                    </div>

                    {/* Department Variance Cards Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {budgets.map((b) => {
                            const remaining = b.allocated - b.spent;
                            const percentSpent = Math.round((b.spent / b.allocated) * 100);
                            
                            let badgeStyle = "bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300";
                            if (b.status === 'Warning') badgeStyle = "bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300";
                            if (b.status === 'Critical') badgeStyle = "bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300";

                            return (
                                <div key={b.id} className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-bold text-sm text-slate-900 dark:text-white">{b.dept}</h3>
                                        <span className={`px-2.5 py-1 rounded-lg text-[10px] font-bold ${badgeStyle}`}>
                                            {b.status}
                                        </span>
                                    </div>

                                    <div className="space-y-2">
                                        <div className="flex justify-between text-xs text-slate-500">
                                            <span>Alokasi Anggaran:</span>
                                            <span className="font-semibold text-slate-800 dark:text-slate-200">{formatIDR(b.allocated)}</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-slate-500">
                                            <span>Pengeluaran (YTD):</span>
                                            <span className="font-semibold text-slate-800 dark:text-slate-200">{formatIDR(b.spent)}</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-slate-500">
                                            <span>Sisa Anggaran:</span>
                                            <span className={`font-bold ${remaining < 0 ? 'text-rose-600' : 'text-emerald-600 dark:text-emerald-400'}`}>{formatIDR(remaining)}</span>
                                        </div>
                                    </div>

                                    {/* Progress Bar */}
                                    <div className="space-y-1">
                                        <div className="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                            <div 
                                                className={`h-full ${percentSpent > 90 ? 'bg-rose-500' : percentSpent > 75 ? 'bg-amber-500' : 'bg-emerald-500'}`} 
                                                style={{ width: `${Math.min(percentSpent, 100)}%` }}
                                            ></div>
                                        </div>
                                        <p className="text-[10px] text-right text-slate-400 font-medium">{percentSpent}% Terpakai</p>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // 3. Operations & Transactions Tab Component
        function OperationsTab({ transactions, setTransactions, searchQuery, setSearchQuery, filterCategory, setFilterCategory, setShowTxModal, formatIDR }) {
            
            const filteredTx = useMemo(() => {
                return transactions.filter(tx => {
                    const matchesSearch = tx.desc.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          tx.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          tx.dept.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCat = filterCategory === 'All' || tx.category === filterCategory;
                    return matchesSearch && matchesCat;
                });
            }, [transactions, searchQuery, filterCategory]);

            return (
                <div className="space-y-6">
                    {/* Controls Bar */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                            {/* Search Input */}
                            <div className="relative w-full sm:w-64">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="Cari transaksi / ID / Dept..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white"
                                />
                            </div>
                            {/* Filter Dropdown */}
                            <select 
                                value={filterCategory}
                                onChange={(e) => setFilterCategory(e.target.value)}
                                className="w-full sm:w-auto px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-xs text-slate-700 dark:text-slate-200 font-medium focus:outline-none"
                            >
                                <option value="All">Semua Kategori</option>
                                <option value="Operational">Operational</option>
                                <option value="Revenue">Revenue</option>
                                <option value="Payroll">Payroll</option>
                                <option value="Accounts Payable">Accounts Payable</option>
                                <option value="Accounts Receivable">Accounts Receivable</option>
                            </select>
                        </div>

                        <button 
                            onClick={() => setShowTxModal(true)}
                            className="w-full sm:w-auto px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-md shadow-blue-600/20 transition-all flex items-center justify-center gap-2"
                        >
                            <i data-lucide="plus" className="w-4 h-4"></i>
                            Tambah Transaksi Baru
                        </button>
                    </div>

                    {/* Data Table Transaksi */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-50 dark:bg-slate-700/60 text-slate-500 dark:text-slate-400 uppercase text-[10px] font-bold">
                                    <tr>
                                        <th className="p-4">Tanggal & ID</th>
                                        <th className="p-4">Deskripsi Transaksi</th>
                                        <th className="p-4">Departemen</th>
                                        <th className="p-4">Kategori</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4 text-right">Nominal (IDR)</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700/60">
                                    {filteredTx.length > 0 ? (
                                        filteredTx.map((tx) => (
                                            <tr key={tx.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-700/30 transition-colors">
                                                <td className="p-4">
                                                    <div className="font-semibold text-slate-800 dark:text-slate-200">{tx.date}</div>
                                                    <div className="text-[10px] font-mono text-slate-400">{tx.id}</div>
                                                </td>
                                                <td className="p-4 font-semibold text-slate-900 dark:text-white max-w-xs truncate">{tx.desc}</td>
                                                <td className="p-4 text-slate-600 dark:text-slate-300">{tx.dept}</td>
                                                <td className="p-4">
                                                    <span className="px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px] font-medium">
                                                        {tx.category}
                                                    </span>
                                                </td>
                                                <td className="p-4">
                                                    <span className={`px-2.5 py-1 rounded-lg text-[10px] font-bold ${
                                                        tx.status === 'Completed' 
                                                            ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300' 
                                                            : 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300'
                                                    }`}>
                                                        {tx.status}
                                                    </span>
                                                </td>
                                                <td className={`p-4 text-right font-bold text-sm ${tx.amount > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}`}>
                                                    {tx.amount > 0 ? `+${formatIDR(tx.amount)}` : formatIDR(tx.amount)}
                                                </td>
                                            </tr>
                                        ))
                                    ) : (
                                        <tr>
                                            <td colSpan="6" className="p-8 text-center text-slate-400">
                                                Tidak ditemukan transaksi yang sesuai kriteria pencarian.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // 4. Compliance & Risk Management Tab Component
        function ComplianceTab({ risks, setRisks, triggerToast }) {
            return (
                <div className="space-y-6">
                    {/* Compliance Overview Banner */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center font-bold">
                                <i data-lucide="shield-check" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 className="text-xs text-slate-500">Skor Kepatuhan Finansial</h4>
                                <div className="text-xl font-bold text-slate-900 dark:text-white">94 / 100</div>
                                <p className="text-[10px] text-emerald-600 font-medium">Standar ISO 37001 Compliant</p>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center font-bold">
                                <i data-lucide="file-warning" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 className="text-xs text-slate-500">Item Audit Terbuka</h4>
                                <div className="text-xl font-bold text-slate-900 dark:text-white">3 Masalah</div>
                                <p className="text-[10px] text-amber-600 font-medium">Membutuhkan Tindakan Lanjutan</p>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-500 flex items-center justify-center font-bold">
                                <i data-lucide="award" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h4 className="text-xs text-slate-500">Audit Eksternal Terakhir</h4>
                                <div className="text-xl font-bold text-slate-900 dark:text-white">Opini WTP</div>
                                <p className="text-[10px] text-slate-400 font-medium">WTP (Unqualified Opinion) 2025</p>
                            </div>
                        </div>
                    </div>

                    {/* Table Audit & Risiko */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <h3 className="font-bold text-base text-slate-900 dark:text-white">Matriks Pelacakan Risiko & Audit Internal</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-50 dark:bg-slate-700/50 text-slate-500 uppercase text-[10px]">
                                    <tr>
                                        <th className="p-3">Kode Audit</th>
                                        <th className="p-3">Judul Pengawasan / Program Audit</th>
                                        <th className="p-3">Kategori Risiko</th>
                                        <th className="p-3">Tingkat Risiko</th>
                                        <th className="p-3">Batas Waktu</th>
                                        <th className="p-3">Status</th>
                                        <th className="p-3 text-right">Aksi Governance</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                    {risks.map((item) => (
                                        <tr key={item.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-700/30">
                                            <td className="p-3 font-mono text-slate-400">{item.id}</td>
                                            <td className="p-3 font-semibold text-slate-800 dark:text-slate-200">{item.title}</td>
                                            <td className="p-3 text-slate-600 dark:text-slate-300">{item.category}</td>
                                            <td className="p-3">
                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                    item.riskLevel === 'High' ? 'bg-rose-100 text-rose-700' :
                                                    item.riskLevel === 'Medium' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
                                                }`}>
                                                    {item.riskLevel}
                                                </span>
                                            </td>
                                            <td className="p-3 text-slate-500">{item.dueDate}</td>
                                            <td className="p-3">
                                                <span className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-[10px]">
                                                    {item.status}
                                                </span>
                                            </td>
                                            <td className="p-3 text-right">
                                                <button 
                                                    onClick={() => {
                                                        setRisks(risks.map(r => r.id === item.id ? { ...r, status: 'Approved' } : r));
                                                        triggerToast(`Status Audit ${item.id} berhasil diperbarui menjadi Approved.`);
                                                    }}
                                                    className="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-[10px]"
                                                >
                                                    Setujui Audit
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // 5. Reporting Tab Component
        function ReportingTab({ transactions, filterPeriod, setFilterPeriod, triggerToast, formatIDR }) {
            const reportIncome = useMemo(() => transactions.filter(t => t.amount > 0).reduce((acc, t) => acc + t.amount, 0), [transactions]);
            const reportExpense = useMemo(() => Math.abs(transactions.filter(t => t.amount < 0).reduce((acc, t) => acc + t.amount, 0)), [transactions]);
            const netProfit = reportIncome - reportExpense;

            return (
                <div className="space-y-6">
                    {/* Period Selector & Download Actions */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-xs text-slate-500 font-medium">Rentang Waktu Laporan:</span>
                            <select 
                                value={filterPeriod}
                                onChange={(e) => setFilterPeriod(e.target.value)}
                                className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-xs font-semibold text-slate-800 dark:text-slate-200 focus:outline-none"
                            >
                                <option value="Q4-2026">Kuartal 4 - 2026</option>
                                <option value="YTD">Year-to-Date (YTD 2026)</option>
                                <option value="FY-2025">Full Year 2025</option>
                            </select>
                        </div>

                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => triggerToast('Laporan Keuangan (PDF) berhasil diunduh.')}
                                className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold text-xs transition-colors flex items-center gap-2"
                            >
                                <i data-lucide="file-text" className="w-4 h-4 text-rose-500"></i> Unduh PDF
                            </button>
                            <button 
                                onClick={() => triggerToast('Data Keuangan (Excel XLSX) berhasil di-export.')}
                                className="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md shadow-emerald-600/20 transition-all flex items-center gap-2"
                            >
                                <i data-lucide="table" className="w-4 h-4"></i> Export Excel
                            </button>
                        </div>
                    </div>

                    {/* Financial Statement Preview (Income Statement) */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
                        <div className="text-center border-b border-slate-100 dark:border-slate-700 pb-4">
                            <h2 className="text-lg font-bold text-slate-900 dark:text-white uppercase tracking-wider">PT ENTERPRISE CORPORATE TBD</h2>
                            <h3 className="text-sm font-semibold text-blue-600 dark:text-blue-400">Laporan Laba Rugi Komprehensif (Income Statement)</h3>
                            <p className="text-xs text-slate-400">Periode yang Berakhir pada 31 Oktober 2026 (Dinyatakan dalam IDR)</p>
                        </div>

                        <div className="max-w-2xl mx-auto space-y-4 text-xs">
                            {/* Revenues */}
                            <div className="space-y-2">
                                <div className="flex justify-between font-bold text-sm text-slate-900 dark:text-white border-b pb-1">
                                    <span>PENDAPATAN US OPERASIONAL</span>
                                    <span></span>
                                </div>
                                <div className="flex justify-between text-slate-600 dark:text-slate-300 pl-4">
                                    <span>Penjualan & Layanan Jasa Teknologi</span>
                                    <span>{formatIDR(reportIncome)}</span>
                                </div>
                                <div className="flex justify-between font-bold text-slate-900 dark:text-white pt-1 bg-slate-50 dark:bg-slate-700/40 p-2 rounded-lg">
                                    <span>TOTAL PENDAPATAN</span>
                                    <span className="text-emerald-600 dark:text-emerald-400">{formatIDR(reportIncome)}</span>
                                </div>
                            </div>

                            {/* Expenses */}
                            <div className="space-y-2 pt-2">
                                <div className="flex justify-between font-bold text-sm text-slate-900 dark:text-white border-b pb-1">
                                    <span>BEBAN OPERASIONAL & GAJI</span>
                                    <span></span>
                                </div>
                                <div className="flex justify-between text-slate-600 dark:text-slate-300 pl-4">
                                    <span>Beban Operasional & Infrastruktur</span>
                                    <span>{formatIDR(reportExpense * 0.6)}</span>
                                </div>
                                <div className="flex justify-between text-slate-600 dark:text-slate-300 pl-4">
                                    <span>Beban Gaji & Tunjangan SDM</span>
                                    <span>{formatIDR(reportExpense * 0.4)}</span>
                                </div>
                                <div className="flex justify-between font-bold text-slate-900 dark:text-white pt-1 bg-slate-50 dark:bg-slate-700/40 p-2 rounded-lg">
                                    <span>TOTAL BEBAN OPERASIONAL</span>
                                    <span className="text-rose-600">{formatIDR(reportExpense)}</span>
                                </div>
                            </div>

                            {/* Net Income Result */}
                            <div className="pt-4">
                                <div className="flex justify-between font-bold text-base text-slate-900 dark:text-white bg-blue-50 dark:bg-blue-950/60 p-3 rounded-xl border border-blue-200 dark:border-blue-800">
                                    <span>LABA BERSIH (NET PROFIT)</span>
                                    <span className={netProfit >= 0 ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600"}>
                                        {formatIDR(netProfit)}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // 6. Settings & Access Control Tab Component
        function SettingsTab({ userRole, setUserRole, users, triggerToast }) {
            return (
                <div className="space-y-6">
                    {/* RBAC Role Switch Simulation */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <div>
                            <h3 className="font-bold text-base text-slate-900 dark:text-white">Simulasi Peran Pengguna (RBAC Framework)</h3>
                            <p className="text-xs text-slate-500">Pilih peran untuk menguji hak akses otorisasi sistem keuangan.</p>
