                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            {['CFO', 'Finance Manager', 'Staff', 'Auditor'].map((role) => (
                                <button
                                    key={role}
                                    onClick={() => {
                                        setUserRole(role);
                                        triggerToast(`Peran aktif diubah ke ${role}`);
                                    }}
                                    className={`p-3 rounded-xl font-bold text-xs border text-center transition-all ${
                                        userRole === role
                                            ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-600/20'
                                            : 'bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100'
                                    }`}
                                >
                                    {role}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Users Management Table */}
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <div className="flex items-center justify-between">
                            <h3 className="font-bold text-base text-slate-900 dark:text-white">Daftar Pengguna & Hak Akses Terdaftar</h3>
                            <button onClick={() => triggerToast('Fitur Tambah Pengguna Terdaftar disimulasikan.')} className="px-3 py-1.5 rounded-xl bg-blue-600 text-white font-semibold text-xs">
                                + Tambah User
                            </button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-50 dark:bg-slate-700/50 text-slate-500 uppercase text-[10px]">
                                    <tr>
                                        <th className="p-3">Nama Lengkap</th>
                                        <th className="p-3">Email Korporat</th>
                                        <th className="p-3">Peran Akses</th>
                                        <th className="p-3">Status</th>
                                        <th className="p-3">Login Terakhir</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                    {users.map(u => (
                                        <tr key={u.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-700/30">
                                            <td className="p-3 font-semibold text-slate-900 dark:text-white">{u.name}</td>
                                            <td className="p-3 text-slate-500">{u.email}</td>
                                            <td className="p-3">
                                                <span className="px-2.5 py-1 rounded-md bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-300 font-bold text-[10px]">
                                                    {u.role}
                                                </span>
                                            </td>
                                            <td className="p-3">
                                                <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 font-bold text-[10px]">
                                                    {u.status}
                                                </span>
                                            </td>
                                            <td className="p-3 text-slate-400">{u.lastLogin}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
